<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我們家的旅行</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="旅行">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app"><div class="center muted">載入中…</div></div>
  <noscript>這個網頁需要開啟 JavaScript。</noscript>
  <script>
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      // 第一次安裝時不需要重新載入；之後有新版本接手時，自動重新載入一次
      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!hadController || reloading) return;
        reloading = true;
        // 正在編輯（有對話框開著）就等關掉再更新，避免打到一半的內容不見
        (function tryReload() {
          if (document.querySelector(".overlay")) return setTimeout(tryReload, 1500);
          location.reload();
        })();
      });
      navigator.serviceWorker.register("./sw.js").then(function (reg) {
        // App 從背景回到前景時檢查有沒有新版本（手機上常常一直開著不關）
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") reg.update().catch(function () {});
        });
      }).catch(function (e) { console.warn("SW", e); });
    }
  </script>
</body>
</html>
